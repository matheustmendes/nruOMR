dashboard_spreadsheet_id: "1d4SfVWnG8iwk90jGnPIj7U6bPG5nriA5F2b-6pvSt60"

# Base de bolsistas do RU (cadastro oficial, mantido por fora deste sistema).
# Usada só como fonte adicional de fallback quando uma matrícula lida por OCR
# não bate com o cadastro mestre (planilha de impressão + histórico do
# Sheets) — ver recuperar_lote.carregar_cadastro_bolsistas. Considera só as
# abas ONDINA, CANELA e SÃO LÁZARO da planilha (as demais não são cadastro
# de bolsista).
bolsistas:
  spreadsheet_id: "1VjnEshyExQtgks7b3tc216b8DjBGyS4u9PEW2zVjPRM"

# Sincronização de lotes entre máquinas (ver SINCRONIZACAO_LOTES.md)
#
# O lote (roster + geometria congelados no momento da impressão) nasce só na
# máquina que gerou o template. Sem isso, a máquina que processa o scan não
# o enxerga. Reaproveita a planilha do dashboard acima (já compartilhada
# como Editor) numa aba nova ("lotes_sync") — nenhuma configuração extra é
# necessária. PDF não sincroniza (só o roster/geometria, que é o que
# resolve o bug de identidade); reimprimir continua só na máquina que gerou.
#
# Use os campos abaixo só se quiser uma planilha separada da do dashboard
# (ex.: por controle de acesso). Nesse caso, compartilhe-a também com o
# "client_email" de credentials_sheets.json, permissão de Editor.
lotes_sincronizacao:
  spreadsheet_id: ""   # vazio = reaproveita dashboard_spreadsheet_id
  aba: "lotes_sync"

# Módulo de justificativas — respostas do Google Forms
# Deixe spreadsheet_id vazio para desativar o módulo.
#
# Como configurar:
#   1. Crie um Google Form com campos de Matrícula, Nome, Período e Justificativa
#   2. Em "Respostas" → vincule a uma planilha Google Sheets
#   3. Compartilhe essa planilha com o client_email das credenciais (permissão Leitor)
#   4. Cole o ID da planilha abaixo (URL: /spreadsheets/d/<ID>/edit)
#   5. Ajuste os nomes das colunas conforme os títulos das perguntas do seu formulário
formulario_justificativas:
  spreadsheet_id: "1NcZvxxhRVHouQ6HQ8Smq9fU8vtAWkNjc5us9gEn9BcY"
  coluna_timestamp: "Carimbo de data/hora"
  coluna_nome: "Nome completo"
  coluna_matricula: "Matrícula"
  coluna_local: "Local de Refeição"
  coluna_datas: "Datas de ausência"
  coluna_comprovante: "Comprovante de Ausência"
  coluna_parecer: "Parecer"
  coluna_comentario: "Comentário (Se negado )"
